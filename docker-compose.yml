services:
  # ============================
  # Database: PostgreSQL 15
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: vnu_research_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1203
      POSTGRES_DB: vnu_research_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vnu_research_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================
  # Cache: Redis
  # ============================
  redis:
    image: redis:7-alpine
    container_name: vnu_research_redis
    ports:
      - "6379:6379"

  # ============================
  # Backend: FastAPI + PostgreSQL
  # ============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vnu_research_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:1203@postgres:5432/vnu_research_db"
      SECRET_KEY: "change-this-secret-before-deploy"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/seed_data.py:/app/seed_data.py
    # Entrypoint xử lý migration + seed, sau đó chạy uvicorn
    # Truyền --reload để hot-reload khi dev
    command: ["--reload"]

  # ============================
  # Frontend: React + Vite
  # ============================
  frontend:
    build:
      context: ./frontend/vnu-frontend
      dockerfile: Dockerfile
    container_name: vnu_research_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "/api/v1"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

  # ============================
  # Reverse Proxy: Nginx
  # ============================
  nginx:
    image: nginx:alpine
    container_name: vnu_research_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # ============================
  # Observability: Prometheus
  # ============================
  prometheus:
    image: prom/prometheus:latest
    container_name: vnu_research_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - backend

  # ============================
  # Observability: Grafana
  # ============================
  grafana:
    image: grafana/grafana:latest
    container_name: vnu_research_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
