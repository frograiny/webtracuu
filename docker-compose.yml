services:
  # ============================
  # Database: PostgreSQL 15
  # ============================
  postgres:
    image: postgres:15-alpine
    container_name: vnu_research_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1203
      POSTGRES_DB: vnu_research_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vnu_research_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================
  # Backend: FastAPI + PostgreSQL
  # ============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vnu_research_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:1203@postgres:5432/vnu_research_db"
      SECRET_KEY: "change-this-secret-before-deploy"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/seed_data.py:/app/seed_data.py
    # Entrypoint xử lý migration + seed, sau đó chạy uvicorn
    # Truyền --reload để hot-reload khi dev
    command: ["--reload"]

  # ============================
  # Frontend: React + Vite
  # ============================
  frontend:
    build:
      context: ./frontend/vnu-frontend
      dockerfile: Dockerfile
    container_name: vnu_research_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend

volumes:
  postgres_data:
